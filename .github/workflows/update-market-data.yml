name: Update Market Data

on:
  schedule:
    # Every 30 minutes during NYMEX trading hours (Mon-Fri, 13:00-21:00 UTC = 8AM-4PM EST)
    - cron: '0,30 13-21 * * 1-5'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas playwright
          playwright install --with-deps chromium

      - name: Fetch market data (Yahoo Finance)
        run: python scripts/fetch_market_data.py

      - name: Fetch physical data (EIA + Polymarket)
        run: python scripts/fetch_physical_data.py

      - name: Fetch OPEC Watch data (CME via Playwright)
        run: python scripts/fetch_opec_watch.py
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/market-data.json docs/data/physical-data.json docs/data/opec-watch.json docs/physical-markets.js
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
